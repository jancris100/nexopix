# The scheduler: every 10 minutes it asks Nexopix to publish the approved pieces whose moment arrived.
# Needs the repository secret NEXOPIX_CRON_SECRET with the same value as CRON_SECRET in Vercel.
# GitHub may run scheduled jobs a few minutes late; "Run workflow" publishes right away.
name: Publish scheduled pieces

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the scheduler to publish
        env:
          CRON_SECRET: ${{ secrets.NEXOPIX_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "NEXOPIX_CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://nexopix.vercel.app/api/cron/publish)
          cat response.json
          echo
          test "$status" = "200"
